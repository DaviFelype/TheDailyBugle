[package]
name = "thedailybugle"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Cybersecurity feed for the Omarchy bar"
license = "MIT"
repository = "https://github.com/DaviFelype/TheDailyBugle"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
# Builder API only: no derive macros, no help or suggestion rendering.
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
# rustls with ring: the default aws-lc-rs provider carries the OpenSSL license,
# which deny.toml does not allow, and a much larger C build.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
insta = { version = "=1.49.0", default-features = false }
# No remote or file references: the schema is self-contained.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
wiremock = "=0.6.5"
