[package]
name = "thedailybugle-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
thedailybugle = { path = ".." }

[[bin]]
name = "plain_text"
path = "fuzz_targets/plain_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "https_url"
path = "fuzz_targets/https_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kev_catalog"
path = "fuzz_targets/kev_catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "poc_list"
path = "fuzz_targets/poc_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kev_cache"
path = "fuzz_targets/kev_cache.rs"
test = false
doc = false
bench = false

# Its own workspace: the fuzz harness and its nightly build stay out of the
# main crate's dependency graph.
[workspace]
