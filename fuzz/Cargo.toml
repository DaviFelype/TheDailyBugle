[package]
name = "thedailybugle-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
thedailybugle = { path = ".." }

[[bin]]
name = "parse_command"
path = "fuzz_targets/parse_command.rs"
test = false
doc = false
bench = false

# Its own workspace: the fuzz harness and its nightly build stay out of the
# main crate's dependency graph.
[workspace]
