# cargo-deny: advisories, licenses, banned crates and allowed sources.
# Runs for the main crate and for fuzz/ (its own workspace).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a reason and an issue link.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with shipping an MIT binary.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The list covers future dependencies too; not every entry is in use yet.
unused-allowed-license = "allow"
exceptions = [
  # Bundles LLVM's libFuzzer (NCSA, permissive). Used only in fuzz/, never shipped.
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies (fuzz/ -> the main crate) are fine: neither is published.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS is rustls only (ADR-0001)" },
  { crate = "openssl-sys", reason = "TLS is rustls only (ADR-0001)" },
  { crate = "native-tls", reason = "TLS is rustls only (ADR-0001)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
