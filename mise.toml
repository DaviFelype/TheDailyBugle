# Pinned developer tools. Install with `scripts/bootstrap.sh` (run on the host,
# not inside ai-jail: the sandbox blocks the download hosts).
# Tools that only CI needs live in mise.ci.toml, so they never land on the host.
#
# Supply-chain rule: only pin releases published at least 7 days ago.
# Rust itself is pinned in rust-toolchain.toml; keep both in sync.

[tools]
rust = "1.99.1"

# Runs the Model.js tests (`node --test`), no npm packages.
node = "26.12.0"

# Installers used by the other backends (installed first by bootstrap.sh).
uv = "0.13.5"
cargo-binstall = "1.26.1"

# Cargo subcommands
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-audit" = "0.22.2"
cargo-deny = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-machete" = "0.9.2"

# Commits, hooks and the scanners the git hooks run
cocogitto = "7.0.0"
lefthook = "2.2.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.31.1"

[settings]
cargo.binstall = true
