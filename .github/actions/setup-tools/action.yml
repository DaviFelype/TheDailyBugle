name: Set up pinned tools
description: >-
  Installs mise and the given tools at the versions pinned in mise.toml
  (and mise.ci.toml when the job sets MISE_ENV=ci). cargo-binstall and uv go
  first because the cargo and pipx backends use them.

inputs:
  tools:
    description: Space-separated tool names as written in mise.toml.
    required: false
    default: ""
  cache:
    description: Cache mise installs. Must be "false" in release workflows.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.10.19
        install_args: cargo-binstall uv
        cache: ${{ inputs.cache }}

    - name: Install tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      # mise.toml pins rust, so mise refuses to install any cargo: tool until
      # it has rust itself. It reuses the toolchain rustup already installed.
      run: |
        read -ra tools <<<"$TOOLS"
        for tool in "${tools[@]}"; do
          if [[ "$tool" == cargo:* ]]; then
            mise install rust
            break
          fi
        done
        mise install "${tools[@]}"
