name: Set up pinned tools
description: >-
  Installs mise and the given tools at the versions pinned in mise.toml
  (and mise.ci.toml when the job sets MISE_ENV=ci). cargo-binstall and uv go
  first because the cargo and pipx backends use them.

inputs:
  tools:
    description: Space-separated tool names as written in mise.toml.
    required: false
    default: ""
  cache:
    description: Cache mise installs. Must be "false" in release workflows.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.10.19
        install_args: cargo-binstall uv
        cache: ${{ inputs.cache }}

    - name: Install tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        read -ra tools <<<"$TOOLS"
        mise install "${tools[@]}"
