# Temporary: finds the archlinux:base digest for ci.yml. Dropped before merge.
# Logs are unreadable from ai-jail, so results go out as annotations.
name: probe
on:
  pull_request:
permissions: {}
jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: archlinux dated base tags
        run: |
          curl -fsS --max-time 30 \
            'https://hub.docker.com/v2/repositories/library/archlinux/tags?name=base-2026&page_size=10&ordering=last_updated' \
            | jq -r '.results[] | "::notice title=\(.name)::\(.digest) \(.last_updated)"'
